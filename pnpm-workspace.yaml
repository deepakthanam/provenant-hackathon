packages:
  - apps/*
  - packages/*

# Supply-chain guard: never resolve a package version published less than 14 days ago.
minimumReleaseAge: 20160

onlyBuiltDependencies:
  - esbuild
  - "@biomejs/biome"
  - embedded-postgres
  - "@embedded-postgres/windows-x64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
  - sharp
  - "@tailwindcss/oxide"

# @paypal/paypal-server-sdk 1.1.0 (pulled in by @paypal/agent-toolkit) requires tslib 2 at runtime but
# declares it only as a devDependency; without this it resolves a stray tslib 1.x and crashes with
# "tslib_1.__spreadArray is not a function".
packageExtensions:
  "@paypal/paypal-server-sdk@1":
    dependencies:
      tslib: "^2.5.0"
