# Optional: Postgres via Docker. Without Docker, `pnpm dev` starts an embedded Postgres 16 instead.
# With Docker: `docker compose -f infra/docker-compose.yml up -d` and set DATABASE_MODE=external.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: provenant
      POSTGRES_PASSWORD: provenant
      POSTGRES_DB: provenant
    ports:
      - "5433:5432"
    volumes:
      - provenant-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenant"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  provenant-pg:
